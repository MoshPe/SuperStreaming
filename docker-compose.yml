name: superstreaming

networks:
  superstreaming:
    driver: bridge

volumes:
  origin-recordings:
  minio-data:
  postgres-data:
  grafana-data:

services:

  # ── MediaMTX Origin ──────────────────────────────────────────────
  mediamtx-origin-0:
    build:
      context: ./build/mediamtx
      dockerfile: Dockerfile
    image: superstreaming/mediamtx:local
    container_name: mediamtx-origin-0
    restart: unless-stopped
    networks:
      - superstreaming
    ports:
      - "8554:8554"        # RTSP publish
      - "8890:8890/udp"    # SRT ingest (WAN camera relay)
      - "9997:9997"        # Control API (origin)
    volumes:
      - ./configs/mediamtx/origin.yml:/mediamtx.yml:ro
      - origin-recordings:/recordings
    environment:
      - PUBLISH_SECRET=${PUBLISH_SECRET}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
    healthcheck:
      test: ["CMD", "/mediamtx", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── Coturn STUN/TURN ──────────────────────────────────────────────
  coturn:
    image: coturn/coturn:latest
    container_name: coturn
    restart: unless-stopped
    networks:
      - superstreaming
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49152-49201:49152-49201/udp"    # relay port range
    environment:
      - COTURN_EXTERNAL_IP=${COTURN_EXTERNAL_IP:-127.0.0.1}
      - TURN_SECRET=${TURN_SECRET}
    entrypoint: ["/bin/sh", "-c"]
    command: >
      exec turnserver -n --log-file=stdout
      --external-ip=$$COTURN_EXTERNAL_IP
      --min-port=49152 --max-port=49201
      --use-auth-secret --static-auth-secret=$$TURN_SECRET
      --realm=superstreaming --no-dtls --no-tls

  # ── MediaMTX Read Replica ─────────────────────────────────────────
  mediamtx-read:
    build:
      context: ./build/mediamtx
      dockerfile: Dockerfile
    image: superstreaming/mediamtx:local
    container_name: mediamtx-read
    restart: unless-stopped
    networks:
      - superstreaming
    ports:
      - "8889:8889"        # WebRTC WHEP signaling (TCP)
      - "8189:8189/udp"    # WebRTC media (UDP — happy path)
      - "8189:8189/tcp"    # WebRTC media (TCP — fallback)
      - "9998:9997"        # Control API (read, mapped to host 9998)
    volumes:
      - ./configs/mediamtx/read.yml:/mediamtx.yml:ro
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - VIEWER_SECRET=${VIEWER_SECRET}
      - WEBRTC_EXTERNAL_HOST=${WEBRTC_EXTERNAL_HOST}
      - COTURN_EXTERNAL_IP=${COTURN_EXTERNAL_IP:-127.0.0.1}
      - TURN_SECRET=${TURN_SECRET}
    depends_on:
      mediamtx-origin-0:
        condition: service_healthy
      coturn:
        condition: service_started
    healthcheck:
      test: ["CMD", "/mediamtx", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── MinIO ─────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    networks:
      - superstreaming
    ports:
      - "9000:9000"        # S3 API
      - "9001:9001"        # MinIO console
    volumes:
      - minio-data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # MinIO bucket init (runs once, creates the recordings bucket)
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    networks:
      - superstreaming
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
        mc mb --ignore-existing local/$$MINIO_BUCKET;
        echo 'MinIO bucket ready';
      "
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=${MINIO_BUCKET}

  # ── Recording Uploader ────────────────────────────────────────────
  recording-uploader:
    image: superstreaming/recording-uploader:latest
    build:
      context: .
      dockerfile: build/recording-uploader/Dockerfile
    container_name: recording-uploader
    restart: unless-stopped
    networks:
      - superstreaming
    volumes:
      - origin-recordings:/recordings
    environment:
      - RECORDINGS_DIR=/recordings
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=${MINIO_BUCKET}
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ── Postgres ───────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    networks:
      - superstreaming
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── API Server ─────────────────────────────────────────────────────
  api-server:
    image: superstreaming/api-server:latest
    build:
      context: .
      dockerfile: build/api-server/Dockerfile
    container_name: api-server
    restart: unless-stopped
    networks:
      - superstreaming
    ports:
      - "8080:8080"
    environment:
      - LISTEN_ADDR=:8080
      - ORIGIN_COUNT=1
      - ORIGIN_HOST_TEMPLATE=mediamtx-origin-%d
      - ORIGIN_API_PORT=9997
      - MINIO_ENDPOINT=minio:9000
      - MINIO_PUBLIC_ENDPOINT=localhost:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=${MINIO_BUCKET}
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - CORS_ORIGIN=*
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Web Frontend ───────────────────────────────────────────────────
  web-frontend:
    image: superstreaming/web-frontend:latest
    build:
      context: .
      dockerfile: build/web-frontend/Dockerfile
    container_name: web-frontend
    restart: unless-stopped
    networks:
      - superstreaming
    ports:
      - "80:80"
    environment:
      - MEDIAMTX_WHEP_BASE=http://localhost:8889/
      - API_SERVER_URL=http://localhost:8080
      - VIEWER_PASSWORD=${VIEWER_SECRET}
    depends_on:
      api-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Publisher ─────────────────────────────────────────────────────
  publisher:
    image: superstreaming/publisher:latest
    build:
      context: .
      dockerfile: build/publisher/Dockerfile
    container_name: publisher
    restart: unless-stopped
    networks:
      - superstreaming
    environment:
      - ORIGIN_COUNT=1
      - ORIGIN_HOST_TEMPLATE=mediamtx-origin-%d
      - ORIGIN_RTSP_PORT=8554
      - ORIGIN_SRT_PORT=8890
      - PUBLISH_SECRET=${PUBLISH_SECRET}
      - SRT_LATENCY_MS=${SRT_LATENCY_MS:-200}
      - SRT_PASSPHRASE=${SRT_PASSPHRASE:-}
      - STREAMS=${PUBLISHER_STREAMS:-cam-01=test,cam-02=test,cam-03=test,cam-04=test,cam-05=test,cam-06=test,cam-07=test,cam-08=test,cam-09=test,cam-10=test}
    depends_on:
      mediamtx-origin-0:
        condition: service_healthy

  # ── Prometheus ─────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    networks:
      - superstreaming
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Grafana ────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    networks:
      - superstreaming
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./configs/grafana/dashboards:/etc/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${VIEWER_SECRET}
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/superstreaming.json
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
