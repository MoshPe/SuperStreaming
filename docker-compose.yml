name: superstreaming

networks:
  superstreaming:
    driver: bridge

volumes:
  origin-recordings:
  minio-data:
  postgres-data:
  grafana-data:

services:

  # ── MediaMTX Origin ──────────────────────────────────────────────
  mediamtx-origin-0:
    build:
      context: ./build/mediamtx
      dockerfile: Dockerfile
    image: superstreaming/mediamtx:local
    container_name: mediamtx-origin-0
    restart: unless-stopped
    networks:
      - superstreaming
    ports:
      - "8554:8554"        # RTSP publish
      - "9997:9997"        # Control API (origin)
    volumes:
      - ./configs/mediamtx/origin.yml:/mediamtx.yml:ro
      - origin-recordings:/recordings
    environment:
      - PUBLISH_SECRET=${PUBLISH_SECRET}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
    healthcheck:
      test: ["CMD", "/mediamtx", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── MediaMTX Read Replica ─────────────────────────────────────────
  mediamtx-read:
    build:
      context: ./build/mediamtx
      dockerfile: Dockerfile
    image: superstreaming/mediamtx:local
    container_name: mediamtx-read
    restart: unless-stopped
    networks:
      - superstreaming
    ports:
      - "8889:8889"        # WebRTC WHEP signaling (TCP)
      - "8189:8189/udp"    # WebRTC media (UDP — happy path)
      - "8189:8189/tcp"    # WebRTC media (TCP — fallback)
      - "9998:9997"        # Control API (read, mapped to host 9998)
    volumes:
      - ./configs/mediamtx/read.yml:/mediamtx.yml:ro
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - VIEWER_SECRET=${VIEWER_SECRET}
      - WEBRTC_EXTERNAL_HOST=${WEBRTC_EXTERNAL_HOST}
    depends_on:
      mediamtx-origin-0:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/mediamtx", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── MinIO ─────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    networks:
      - superstreaming
    ports:
      - "9000:9000"        # S3 API
      - "9001:9001"        # MinIO console
    volumes:
      - minio-data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # MinIO bucket init (runs once, creates the recordings bucket)
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    networks:
      - superstreaming
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
        mc mb --ignore-existing local/$$MINIO_BUCKET;
        echo 'MinIO bucket ready';
      "
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=${MINIO_BUCKET}

  # ── Postgres ───────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    networks:
      - superstreaming
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── API Server (stub — replaced in Sub-Project 4) ─────────────────
  api-server:
    image: nginx:alpine
    container_name: api-server
    restart: unless-stopped
    networks:
      - superstreaming
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Web Frontend (stub — replaced in Sub-Project 5) ───────────────
  web-frontend:
    image: nginx:alpine
    container_name: web-frontend
    restart: unless-stopped
    networks:
      - superstreaming
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Prometheus ─────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    networks:
      - superstreaming
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Grafana ────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    networks:
      - superstreaming
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${VIEWER_SECRET}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
