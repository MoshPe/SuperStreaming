apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: superstreaming
  namespace: superstreaming
spec:
  entryPoints:
    - web
  routes:
    # WHEP per-origin — strip prefix before forwarding to MediaMTX
    # e.g. /whep/0/cam-01/whep → /cam-01/whep on mediamtx-read-0
    - match: PathPrefix(`/whep/0`)
      kind: Rule
      priority: 300
      middlewares:
        - name: strip-whep-0
          namespace: superstreaming
      services:
        - name: mediamtx-read-0
          port: 8889

    - match: PathPrefix(`/whep/1`)
      kind: Rule
      priority: 300
      middlewares:
        - name: strip-whep-1
          namespace: superstreaming
      services:
        - name: mediamtx-read-1
          port: 8889

    - match: PathPrefix(`/whep/2`)
      kind: Rule
      priority: 300
      middlewares:
        - name: strip-whep-2
          namespace: superstreaming
      services:
        - name: mediamtx-read-2
          port: 8889

    # API server — /api and /health already match api-server's own routes
    - match: PathPrefix(`/api`) || PathPrefix(`/health`)
      kind: Rule
      priority: 200
      services:
        - name: api-server
          port: 8080

    # Web frontend — catch-all
    - match: PathPrefix(`/`)
      kind: Rule
      priority: 100
      services:
        - name: web-frontend
          port: 80
