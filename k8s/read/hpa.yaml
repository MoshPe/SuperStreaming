apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mediamtx-read
  namespace: superstreaming
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mediamtx-read
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
