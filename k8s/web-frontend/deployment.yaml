apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: superstreaming
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-frontend
  template:
    metadata:
      labels:
        app: web-frontend
    spec:
      containers:
        - name: web-frontend
          image: superstreaming/web-frontend:latest
          ports:
            - containerPort: 80
          env:
            - name: READ_BASE_URLS
              value: "http://NODE_IP:30889/,http://NODE_IP:30890/,http://NODE_IP:30891/"
            - name: API_SERVER_URL
              value: "http://api-server.superstreaming.svc.cluster.local:8080"
            - name: VIEWER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: superstreaming-secrets
                  key: VIEWER_SECRET
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
