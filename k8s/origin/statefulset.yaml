apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mediamtx-origin
  namespace: superstreaming
spec:
  serviceName: mediamtx-origin-headless
  replicas: 1
  selector:
    matchLabels:
      app: mediamtx-origin
  template:
    metadata:
      labels:
        app: mediamtx-origin
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: mediamtx
          image: superstreaming/mediamtx:local
          imagePullPolicy: IfNotPresent
          args: ["/tmp/mediamtx.yml"]
          ports:
            - name: rtsp
              containerPort: 8554
              protocol: TCP
            - name: api
              containerPort: 9997
              protocol: TCP
            - name: metrics
              containerPort: 9998
              protocol: TCP
          envFrom:
            - secretRef:
                name: superstreaming-secrets
          volumeMounts:
            - name: config
              mountPath: /mediamtx.yml
              subPath: mediamtx.yml
            - name: recordings
              mountPath: /recordings
          readinessProbe:
            httpGet:
              path: /v3/config/global/get
              port: 9997
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8554
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
      volumes:
        - name: config
          configMap:
            name: mediamtx-origin-config
  volumeClaimTemplates:
    - metadata:
        name: recordings
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 20Gi
