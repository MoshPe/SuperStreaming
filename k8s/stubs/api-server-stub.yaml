apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: superstreaming
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
    spec:
      containers:
        - name: api-server
          image: nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: api-server
  namespace: superstreaming
spec:
  selector:
    app: api-server
  ports:
    - port: 8080
      targetPort: 80
  type: ClusterIP
