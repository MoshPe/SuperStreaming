apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-json
  namespace: superstreaming
data:
  superstreaming.json: |
    {
      "__inputs": [],
      "__requires": [
        { "type": "grafana", "id": "grafana", "name": "Grafana", "version": "9.0.0" },
        { "type": "datasource", "id": "prometheus", "name": "Prometheus", "version": "1.0.0" }
      ],
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "id": 1,
          "title": "Active Paths per Origin",
          "type": "stat",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 4 },
          "targets": [
            { "expr": "mediamtx_paths", "legendFormat": "{{pod}}", "refId": "A" }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "orientation": "horizontal",
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 50 },
                  { "color": "red", "value": 150 }
                ]
              }
            }
          }
        },
        {
          "id": 2,
          "title": "WebRTC Sessions (Viewers)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 4 },
          "targets": [
            { "expr": "mediamtx_webrtc_sessions", "legendFormat": "{{pod}}", "refId": "A" }
          ],
          "options": { "tooltip": { "mode": "multi" } },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 }
            }
          }
        },
        {
          "id": 3,
          "title": "Inbound Bitrate (bytes/s)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 4, "w": 12, "h": 6 },
          "targets": [
            { "expr": "rate(mediamtx_bytes_received_total[1m])", "legendFormat": "{{pod}} in", "refId": "A" }
          ],
          "options": { "tooltip": { "mode": "multi" } },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 }
            }
          }
        },
        {
          "id": 4,
          "title": "Outbound Bitrate (bytes/s)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 4, "w": 12, "h": 6 },
          "targets": [
            { "expr": "rate(mediamtx_bytes_sent_total[1m])", "legendFormat": "{{pod}} out", "refId": "A" }
          ],
          "options": { "tooltip": { "mode": "multi" } },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 }
            }
          }
        },
        {
          "id": 5,
          "title": "RTSP Sessions (Publishers + Pull)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 10, "w": 12, "h": 6 },
          "targets": [
            { "expr": "mediamtx_rtsp_sessions", "legendFormat": "{{pod}} rtsp", "refId": "A" }
          ],
          "options": { "tooltip": { "mode": "multi" } },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 10 }
            }
          }
        },
        {
          "id": 6,
          "title": "Recording Ingest Rate (5m avg)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 10, "w": 12, "h": 6 },
          "targets": [
            { "expr": "rate(mediamtx_bytes_received_total[5m])", "legendFormat": "{{pod}}", "refId": "A" }
          ],
          "options": { "tooltip": { "mode": "multi" } },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "color": { "mode": "palette-classic" },
              "custom": { "lineWidth": 2, "fillOpacity": 5 }
            }
          }
        }
      ],
      "refresh": "10s",
      "schemaVersion": 36,
      "style": "dark",
      "tags": ["superstreaming", "streaming", "mediamtx"],
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "SuperStreaming",
      "uid": "superstreaming-main",
      "version": 1
    }
