global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # MediaMTX origin — single instance in Docker Compose (ORIGIN_COUNT=1)
  - job_name: mediamtx-origin-0
    static_configs:
      - targets: ["mediamtx-origin-0:9998"]
        labels:
          pod: mediamtx-origin-0
    metrics_path: /metrics
    basic_auth:
      username: any
      password: ""

  # MediaMTX read replica
  - job_name: mediamtx-read
    static_configs:
      - targets: ["mediamtx-read:9998"]
        labels:
          pod: mediamtx-read
    metrics_path: /metrics
    basic_auth:
      username: any
      password: ""
