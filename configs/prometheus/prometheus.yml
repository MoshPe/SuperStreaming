global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: mediamtx-origin
    static_configs:
      - targets:
          - mediamtx-origin-0:9998
    metrics_path: /metrics

  - job_name: mediamtx-read
    static_configs:
      - targets:
          - mediamtx-read:9998
    metrics_path: /metrics
