logLevel: info
logDestinations:
  - stdout

api: yes
apiAddress: :9997

metrics: yes
metricsAddress: :9998

rtsp: no

webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcAdditionalHosts:
  - ${WEBRTC_EXTERNAL_HOST}

authMethod: internal
authInternalUsers:
  - user: viewer
    pass: ${VIEWER_SECRET}
    permissions:
      - action: read
        path: ""

paths:
  "~^(.+)$":
    source: rtsp://internal:${INTERNAL_SECRET}@mediamtx-origin-0:8554/$G1
    sourceOnDemand: no
